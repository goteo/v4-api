services:
  php:
    build:
      context: .
      dockerfile: docker/dev/php/Dockerfile
      target: dev
    container_name: goteo-api-php
    volumes:
      - .:/app
      - ./docker/dev/php/conf.d/openssl.ini:/usr/local/etc/php/conf.d/openssl.ini:ro
      - ./docker/dev/php/conf.d/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro

  nginx:
    image: nginx:1.31.9-alpine3.24
    container_name: goteo-api-nginx
    volumes:
      - .:/app
      - ./docker/dev/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "${APP_HTTP_PORT:-8090}:80"
      - "${APP_HTTPS_PORT:-8091}:443"
    depends_on:
      - php

  mariadb:
    image: mariadb:10.11.2
    container_name: goteo-api-mariadb
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-goteo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-goteo}
      MYSQL_DATABASE: ${DB_DATABASE:-goteo}
      MYSQL_USER: ${DB_USER:-goteo}

volumes:
  mariadb-data:
